# Optional XcodeGen spec.
#
# The checked-in PNGCamera.xcodeproj is the source of truth — this file exists
# so the project can be regenerated from scratch (`xcodegen generate`) if the
# .pbxproj ever conflicts in a merge.

name: PNGCamera
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  PNGCamera:
    type: application
    platform: iOS
    sources:
      - path: PNGCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PNGCamera
        PRODUCT_NAME: PNGCamera
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: PNG Camera
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: still-camera
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: >-
          PNG Camera uses the camera to photograph the subject you want to cut out.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: >-
          The microphone is used only while you dictate a note for a capture.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: >-
          Speech recognition turns your dictated note into text stored with the capture.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: >-
          Saves the transparent PNG you captured to your photo library.
